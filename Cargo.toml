[package]
name = "crest-player"
version = "0.1.0"
edition = "2024"
description = "Terminal music player with YouTube streaming, synchronized lyrics, and ASCII video"
license = "MIT"
repository = "https://github.com/ArvalCode/crest-player"
readme = "README.md"

[dependencies]
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
crossterm = "0.29"

reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ib-romaji = "0.2.1"
dirs = "5.0"
fastrand = "2.3"
zstd = "0.12"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
